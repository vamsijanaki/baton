# Release (FALLBACK path): build the Mac app for a version tag and publish it as a GitHub Release.
#
# The PRIMARY release path is local, on the maintainer's Mac, signed + notarized:
#   npm run release:build && npm run release:publish        (see RELEASING.md)
# This workflow exists for when that isn't possible. Without signing secrets it publishes an ad-hoc signed,
# NOT notarized build (Gatekeeper will warn) — prefer the local path for anything users download.
#
# Triggers:
#   * push of a tag vX.Y.Z (made by `npm run release`): builds and tests the tag as a check, but publishes ONLY when
#     signing secrets are set — so it never races the local signed `npm run release:publish` with an unsigned build.
#   * manual run (Actions → Release → Run workflow) with an EXISTING tag: builds and publishes. If that release already
#     exists (e.g. published locally, signed) it refuses unless "replace_existing" is ticked.
#
# Assets uploaded to the release:
#   Baton-arm64.dmg               stable name — https://github.com/vamsijanaki/baton/releases/latest/download/Baton-arm64.dmg
#   Baton-X.Y.Z-arm64.dmg         versioned copy of the same DMG
#   Baton-X.Y.Z-arm64-mac.zip     zipped .app (what the in-app updater installs)
#   SHA256SUMS.txt                `shasum -a 256 -c SHA256SUMS.txt` to verify
#   Baton-X.Y.Z-arm64-mac.zip.blockmap, latest-mac.yml
#                                 the in-app updater's feed — SIGNED builds only. An ad-hoc build would be refused by
#                                 Squirrel.Mac in every signed Baton, so for an ad-hoc build the feed is not uploaded
#                                 and any existing latest-mac.yml on the release is removed (it would describe a zip
#                                 that is no longer there).
# Release notes = the "## [X.Y.Z]" section of CHANGELOG.md (scripts/changelog-notes.mjs).
#
# Optional signing / notarization secrets (none are set today). scripts/dist.mjs signs as the package.json
# identity when CSC_LINK is present; scripts/release-artifacts.mjs notarizes + staples the DMG when the Apple
# trio is present:
#   CSC_LINK                      base64 of the "Developer ID Application" .p12 (same identity as build.mac.identity)
#   CSC_KEY_PASSWORD              password of that .p12
#   APPLE_ID                      Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password for that Apple ID (appleid.apple.com)
#   APPLE_TEAM_ID                 10-character team id (D9S4VXPF9P)
# The CI signing path has never run; check the first such release by hand (spctl -a -vvv -t exec Baton.app).
#
# The website (site/) is NOT deployed from here; deploy it manually with `npx wrangler deploy` (see RELEASING.md).

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.0.1'
        required: true
        type: string
      replace_existing:
        description: 'Replace the assets of an existing release (e.g. a signed local one) with this build'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest # Apple silicon (arm64)
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check tag matches package.json
        id: ver
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z"; exit 1
          fi
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node scripts/changelog-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ---

          **Download:** `Baton-arm64.dmg` (Apple silicon). Verify with `shasum -a 256 -c SHA256SUMS.txt`.
          EOF
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Detect signing secrets
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -n "$CSC_LINK" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else echo "sign=false" >> "$GITHUB_OUTPUT"; fi

      # Default: ad-hoc signed, not notarized (scripts/dist.mjs falls back when no Developer ID is available).
      - name: Build (ad-hoc signed)
        if: steps.signing.outputs.sign != 'true'
        run: npm run dist

      - name: Checksums (ad-hoc build)
        if: steps.signing.outputs.sign != 'true'
        run: node scripts/release-artifacts.mjs

      # With secrets: Developer ID signed (+ app notarized by electron-builder, DMG by release-artifacts.mjs).
      - name: Build (Developer ID signed)
        if: steps.signing.outputs.sign == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist

      - name: Notarize DMG + checksums (signed build)
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release-artifacts.mjs

      - name: Create or update GitHub Release
        if: github.event_name == 'workflow_dispatch' || steps.signing.outputs.sign == 'true'
        env:
          SIGNED: ${{ steps.signing.outputs.sign }}
          REPLACE: ${{ inputs.replace_existing || steps.signing.outputs.sign == 'true' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          FILES=(
            "release/Baton-arm64.dmg"
            "release/Baton-${VERSION}-arm64.dmg"
            "release/Baton-${VERSION}-arm64-mac.zip"
            "release/SHA256SUMS.txt"
          )
          if [ "$SIGNED" = "true" ]; then FILES+=("release/Baton-${VERSION}-arm64-mac.zip.blockmap"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$REPLACE" != "true" ]; then
              echo "::error::Release $TAG already exists. Re-run with replace_existing to overwrite its assets."; exit 1
            fi
            echo "Release $TAG exists — updating notes and replacing assets."
            gh release edit "$TAG" --title "Baton $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Baton $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag \
              --latest
          fi
          # in-app updater feed: last, after the zip it describes; never for an ad-hoc build
          if [ "$SIGNED" = "true" ]; then
            gh release upload "$TAG" "release/latest-mac.yml" --clobber
          else
            gh release delete-asset "$TAG" latest-mac.yml -y >/dev/null 2>&1 || true
          fi
          echo "Published: https://github.com/$GH_REPO/releases/tag/$TAG"
